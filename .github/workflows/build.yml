name: Build Switch Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup devkitPro
        uses: devkitPro/setup-devkitpro@v1
        with:
          toolchains: switch-dev

      - name: Build Homebrew NRO
        run: |
          make

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchClock-NRO
          path: SwitchClock.nro
