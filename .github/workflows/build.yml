name: Build Switch Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libnx and switch-tools
        run: |
          export PATH="/opt/devkitpro/pacman/bin:/opt/devkitpro/devkitA64/bin:$PATH"
          export DEVKITPRO=/opt/devkitpro
          dkp-pacman -Sy --noconfirm switch-dev switch-tools

      - name: Build Homebrew NRO
        run: |
          export PATH="/opt/devkitpro/pacman/bin:/opt/devkitpro/devkitA64/bin:$PATH"
          export DEVKITPRO=/opt/devkitpro
          make

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchClock-NRO
          path: SwitchClock.nro
