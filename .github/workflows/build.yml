name: Build Switch Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DEVKITPRO: /opt/devkitpro
  PATH: /opt/devkitpro/pacman/bin:/opt/devkitpro/devkitA64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libnx and switch-tools
        run: |
          dkp-pacman -Sy --noconfirm switch-dev switch-tools

      - name: Locate switch.h and switch_rules
        run: |
          find /opt/devkitpro -name "switch.h" -o -name "switch_rules"

      - name: Build Homebrew NRO
        run: |
          make

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchClock-NRO
          path: SwitchClock.nro
